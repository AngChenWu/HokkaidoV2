const calcDur=time=>{let a=String(time).split('-');if(a.length<2)return'';let toMin=s=>{let p=String(s).trim().slice(0,5).split(':');return p.length===2?Number(p[0])*60+Number(p[1]):NaN},s=toMin(a[0]),e=toMin(a[1]),d=e-s;if(!Number.isFinite(d)||d<=0)return'';let h=Math.floor(d/60),m=d%60;return h&&m?`${h}小時${m}分鐘`:h?`${h}小時`:`${m}分鐘`};

  $('#flights').innerHTML=join(flights.map(f=>`<article class="card flight"><div class="fhead"><div class="logo">EVA<br>AIR</div><div><div class="type">${f[1]}</div><div class="air">長榮航空 EVA Air</div><div class="code">${f[0]}</div><div class="froute"><div class="timebox"><div class="lab">起飛</div><div class="time">${f[4]}</div><div class="ap">${f[2]}</div></div><div class="farrow">→</div><div class="timebox"><div class="lab">落地</div><div class="time">${f[5]}</div><div class="ap">${f[3]}</div></div></div><div class="desc">${f[6]}</div></div></div></article>`));
  $('#timeline').innerHTML=join(days.map((d,i)=>`<article class="dcard" id="${dayId(i)}"><aside class="rail"><div class="date"><div class="roc">${d.date}</div><div class="week">${d.week}</div><div class="city">${d.city}</div></div></aside><section class="agenda"><h3>${d.no}｜${d.title}</h3><div class="items">${join(d.items.map(agendaItem))}</div></section><aside class="meta">${lodgingHtml(d)}<div class="meta-card note-warning"><div class="meta-label">備註</div><div class="note-text">${d.note}</div></div></aside></article>`));
  $('#ygrid').innerHTML=join(youthGroups.map(g=>`<article class="group"><div class="ghead"><div><h3>${g[0]}</h3><div class="gbrief">每組4隊，後續可補上帶隊人員、聯絡窗口及每日任務。</div></div><div class="grole">${g[1]}</div></div><div class="tlist">${join(g[2].map(t=>`<section class="team"><div class="photo">照片<br>預留</div><div class="tbody"><div class="ttop"><div><div class="tname">${t[0]}</div><div class="person">${t[1]}</div></div><div class="tags"><span class="tag">${t[2]}</span></div></div><div class="intro"><div class="lab">團隊簡介</div><div class="val">團隊簡介待補，可放入地方創生推動場域、主要產品服務、與本次北海道參訪主題的連結。</div></div><div class="intro"><div class="lab">交流任務</div><div class="val">待定，可依參訪點分派觀察重點、提問任務及回國分享內容。</div></div></div></section>`))}</div></article>`));
  const generalSites=sites.filter(s=>!['hokkaido-gov'].includes(s[0]));
  $('#officialNav').innerHTML=join(officialVisits.map(s=>`<a href='#${s.id}'>${s.title}</a>`));
  $('#officialGrid').innerHTML=join(officialVisits.map(s=>`<article class='official-card' id='${s.id}'><div class='official-top'><div class='official-visual'><div><span>${s.icon}</span>${s.title}<br><small>${s.day}｜${s.city}</small></div></div><div><h3>${mapLink(s.title,`${s.location} ${s.city} 北海道 日本`)}</h3><div class='official-meta'><div class='official-box'><h4>日期</h4><p>${s.date}</p></div><div class='official-box'><h4>地點</h4><p>${s.location}</p></div><div class='official-box full'><h4>我方人員</h4>${officialPeopleHtml(s.people)}</div></div></div></div>${officialTopicsHtml(s.topics)}</article>`));
  $('#siteNav').innerHTML=join(generalSites.map(s=>`<a href='#${s[0]}'>${s[4]}</a>`));
  $('#siteGrid').innerHTML=join(generalSites.map(s=>`<article class='site-card' id='${s[0]}'><div class='site-head'><div class='svis'><div><span>${s[1]}</span>${s[4]}<br><small>圖片預留</small></div></div><div><h3>${mapLink(s[4],`${s[4]} ${s[3]} 北海道 日本`)}</h3><div class='smeta'><span>${s[2]}</span><span>${s[3]}</span><span>${s[5]}</span></div><p class='owner'>負責人／窗口：${s[6]}<span class='pending'>待確認</span></p><div class='ownerBox'><div class='ownerPic'>照片<br>預留</div><div><h4>${s[6]}</h4><p>後續可補入照片、職稱、簡歷及本次接待角色，方便長官快速辨識現場窗口。</p></div></div><p>${s[7]}</p></div></div><div class='ssections'><div class='sbox'><h4>參訪主題</h4><p>${s[5]}</p></div><div class='sbox full'><h4>事蹟摘要與考察價值</h4><p>${s[7]}</p></div><div class='sbox'><h4>現場觀察重點</h4><ul><li>治理機制與營運模式</li><li>人流、消費與地方品牌設計</li><li>可回應台灣地方創生之作法</li></ul></div><div class='sbox'><h4>預計提問問題</h4><ul><li>主要推動單位及財源為何？</li><li>如何評估成效與永續營運？</li><li>與青年、居民或企業合作方式為何？</li></ul></div><div class='sbox'><h4>青年團隊簡報安排</h4><p>待安排，可依團隊屬性及參訪主題指定簡報或提問代表。</p></div></div></article>`));
  $('#siteJumpBar').innerHTML=`<button class='jumpBtn main' data-open='officialFold' data-target='officialFold'>官式拜會</button>${join(officialVisits.map(s=>`<button class='jumpBtn' data-open='officialFold' data-target='${s.id}'>${s.title}</button>`))}<button class='jumpBtn main' data-open='generalFold' data-target='generalFold'>一般參訪點</button>${join(generalSites.map(s=>`<button class='jumpBtn' data-open='generalFold' data-target='${s[0]}'>${s[4]}</button>`))}`;
}
function bind(){
  $$('.tab').forEach(btn=>btn.onclick=()=>{$$('.tab,.sec').forEach(x=>x.classList.remove('on'));btn.classList.add('on');$('#'+btn.dataset.tab).classList.add('on')});
  document.addEventListener('click',e=>{let d=e.target.closest('[data-day]'),s=e.target.closest('[data-site]'),j=e.target.closest('[data-target]');if(d)$('#'+d.dataset.day)?.scrollIntoView({behavior:'smooth'});if(s){e.preventDefault();$('[data-tab="sites"]').click();let id=s.dataset.site,isOfficial=id.startsWith('official-');setTimeout(()=>{if(isOfficial)$('#officialFold').open=true;else $('#generalFold').open=true;$('#'+id)?.scrollIntoView({behavior:'smooth'})},80)}if(j){e.preventDefault();$('[data-tab="sites"]').click();setTimeout(()=>{let fold=$('#'+j.dataset.open);if(fold)fold.open=true;$('#'+j.dataset.target)?.scrollIntoView({behavior:'smooth'})},80)}});
}

const MOBILE_PROMPT_URL='https://angchenwu.github.io/HokkaidoV2_Mobile/';
const MOBILE_PROMPT_KEY='hokkaidoMobilePromptDismissed_v2';
function isMobileLikeBrowser(){
  const ua=navigator.userAgent||navigator.vendor||'';
  const isLine=/Line\//i.test(ua)||/NAVER\(inapp/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const isMobileUA=/Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)||isIOS||isAndroid;
  const vw=Math.min(
    window.innerWidth||9999,
    window.visualViewport?.width||9999,
    window.screen?.width||9999
  );
  const isSmallViewport=vw<=820;
  const isTouchLike=(window.matchMedia&&(
    window.matchMedia('(pointer: coarse)').matches||
    window.matchMedia('(hover: none)').matches
  ))||navigator.maxTouchPoints>0;
  return isMobileUA||isSmallViewport||(isLine&&isTouchLike);
}
function isAlreadyMobilePage(){
  const target=new URL(MOBILE_PROMPT_URL,location.href);
  const currentPath=location.pathname.replace(/\/+$/,'');
  const targetPath=target.pathname.replace(/\/+$/,'');
  return currentPath===targetPath || location.href.replace(/\/+$/,'/')===target.href.replace(/\/+$/,'/');
}
function mobilePrompt(){
  if(document.querySelector('.mobilePromptBackdrop'))return;
  if(isAlreadyMobilePage())return;
  if(!isMobileLikeBrowser())return;
  if(sessionStorage.getItem(MOBILE_PROMPT_KEY)==='1')return;
  const box=document.createElement('div');
  box.className='mobilePromptBackdrop';
  box.setAttribute('role','dialog');
  box.setAttribute('aria-modal','true');
  box.setAttribute('aria-label','前往手機板網頁提示');
  box.innerHTML=`<div class="mobilePromptBox"><span class="mobilePromptBadge">📱 偵測到手機瀏覽</span><div class="mobilePromptTitle">是否前往手機板網頁？</div><p class="mobilePromptText">手機板已針對小螢幕調整字級、卡片寬度與閱讀動線，較適合長官以手機快速查看行程。</p><div class="mobilePromptActions"><button type="button" class="mobilePromptGo" data-mobile-go>前往手機板</button><button type="button" class="mobilePromptStay" data-mobile-stay>留在目前版本</button></div></div>`;
  const close=()=>{sessionStorage.setItem(MOBILE_PROMPT_KEY,'1');box.remove()};
  box.addEventListener('click',e=>{if(e.target===box)close()});
  box.querySelector('[data-mobile-go]').onclick=()=>{location.assign(MOBILE_PROMPT_URL)};
  box.querySelector('[data-mobile-stay]').onclick=close;
  document.body.appendChild(box);
}
function initMobilePrompt(){
  let tries=0;
  const run=()=>{
    tries+=1;
    mobilePrompt();
    if(tries<6&&!document.querySelector('.mobilePromptBackdrop'))setTimeout(run,250);
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});
  else run();
  window.addEventListener('load',run,{once:true});
  window.addEventListener('pageshow',run);
  window.addEventListener('resize',run);
}

shell();render();bind();initMobilePrompt();
})();
</script>
